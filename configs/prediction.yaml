# Trajectory prediction (TCC, Section 3.4.4.1). Used by etapa3_predicao/ and stats/.
kalman:
  model: constant_velocity          # state [x, y, vx, vy], one step per reported observation
  process_noise: 0.03               # Q = 0.03 I
  measurement_noise: 0.1            # R = 0.1 I
  initial_covariance: 1.0           # P0 = I
  initial_velocity: 0.0
damping:
  persistent: 1.0                   # state and covariance kept along the whole trajectory
  damped: 0.95                      # velocity multiplied by gamma after each correction and each extrapolation step
horizons: [5, 10, 15, 30]           # frames; 0.17-1 s at 30 fps (DUT Anti-UAV), 0.2-1.2 s at 25 fps (Track 3)
matching:
  iou_threshold: 0.5                # CLEAR MOT correspondence used by the identity-aware error
  modes: [clear, idf1]
